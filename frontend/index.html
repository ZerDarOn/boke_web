    <meta name="theme-color" content="#10b981" />

    <link rel="alternate" type="application/rss+xml" title="INK.SPIRIT RSS Feed" href="/rss.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700&family=Noto+Serif+SC:wght@400;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-neon: #10b981;
        --color-secondary: #8b5cf6;
      }

      body, a, button, input, textarea, select, .cursor-pointer {
        cursor: none !important;
      }

      #cursor-dot,
      #cursor-outline {
        position: fixed;
        top: 0;
        left: 0;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        z-index: 9999;
        pointer-events: none;
      }
      #cursor-dot {
        width: 8px;
        height: 8px;
        background-color: var(--color-neon);
      }
      #cursor-outline {
        width: 40px;
        height: 40px;
        border: 1px solid var(--color-secondary);
        opacity: 0.5;
        transition: width 0.2s, height 0.2s, background-color 0.2s;
      }

      body:has(a:hover) #cursor-outline,
      body:has(button:hover) #cursor-outline,
      body:has(.cursor-pointer:hover) #cursor-outline,
      body:has(input:hover) #cursor-outline {
        width: 60px;
        height: 60px;
        background-color: rgba(255, 255, 255, 0.05);
        border-color: var(--color-neon);
        mix-blend-mode: difference;
      }
    </style>
    <style>
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #fff;
      }
      .dark ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #0a0a0a;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #fff;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-neon);
      }
      .vertical-text {
        writing-mode: vertical-rl;
        text-orientation: upright;
      }
      
      input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #ffffff;
        border: 2px solid #000000;
        cursor: pointer;
        margin-top: -6px;
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        border-radius: 2px;
      }
    </style>
    <link rel="stylesheet" href="/src/index.css">
</head>
  <body class="bg-paper text-ink antialiased overflow-x-hidden selection:bg-neon selection:text-white dark:bg-ink dark:text-paper transition-colors duration-300">
    <div id="cursor-dot"></div>
    <div id="cursor-outline"></div>
    <script>
        const dot = document.getElementById("cursor-dot");
        const outline = document.getElementById("cursor-outline");

        window.addEventListener("mousemove", (e) => {
            const posX = e.clientX;
            const posY = e.clientY;

            dot.style.left = `${posX}px`;
            dot.style.top = `${posY}px`;

            outline.animate({
                left: `${posX}px`,
                top: `${posY}px`
            }, { duration: 500, fill: "forwards" });
        });
    </script>
    <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
