<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 不发送 Referer：允许加载 B站(i0.hdslb.com)等做了防盗链的图片 -->
    <meta name="referrer" content="no-referrer" />
    
    <!-- SEO Meta Tags -->
    <title>INK.SPIRIT | Cyber-Ink Evolution - 个人博客</title>
    <meta name="description" content="INK.SPIRIT - 一个融合水墨美学与赛博朋克风格的个人博客，分享技术文章、项目经历、追番记录和生活点滴。" />
    <meta name="keywords" content="博客,技术文章,前端开发,React,TypeScript,水墨风格,赛博朋克" />
    <meta name="author" content="CYBER.RONIN" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="INK.SPIRIT | Cyber-Ink Evolution" />
    <meta property="og:description" content="融合水墨美学与赛博朋克风格的个人博客" />
    <meta property="og:site_name" content="INK.SPIRIT" />
    <meta property="og:locale" content="zh_CN" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="INK.SPIRIT | Cyber-Ink Evolution" />
    <meta name="twitter:description" content="融合水墨美学与赛博朋克风格的个人博客" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#10b981" />
    <meta name="msapplication-TileColor" content="#0a0a0a" />
    
    <link rel="alternate" type="application/rss+xml" title="INK.SPIRIT RSS Feed" href="/rss.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700&family=Noto+Serif+SC:wght@400;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-neon-hsl: 150 100% 40%;
        --color-neon-dark-hsl: 150 100% 30%;
        --color-secondary-hsl: 260 90% 65%;
        --color-neon: hsl(150 100% 40%);
        --color-secondary: hsl(260 90% 65%);
      }

      /* 仅当自定义光标启用时(非触屏，由 CyberCursor 添加 .custom-cursor-on)才隐藏系统指针 */
      .custom-cursor-on,
      .custom-cursor-on a,
      .custom-cursor-on button,
      .custom-cursor-on input,
      .custom-cursor-on textarea,
      .custom-cursor-on select,
      .custom-cursor-on .cursor-pointer {
        cursor: none !important;
      }
    </style>
    <style>
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #fff;
      }
      .dark ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #0a0a0a;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #fff;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-neon);
      }
      .vertical-text {
        writing-mode: vertical-rl;
        text-orientation: upright;
      }
      
      input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #ffffff;
        border: 2px solid #000000;
        cursor: pointer;
        margin-top: -6px;
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        border-radius: 2px;
      }
    </style>
    <link rel="stylesheet" href="/src/index.css">
</head>
  <body class="bg-paper text-ink antialiased overflow-x-hidden selection:bg-neon selection:text-white dark:bg-ink dark:text-paper transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
