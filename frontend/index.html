<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 不发送 Referer：允许加载 B站(i0.hdslb.com)等做了防盗链的图片 -->
    <meta name="referrer" content="no-referrer" />
    
    <!-- SEO Meta Tags (兜底值，运行时由各页面 SEO 组件动态覆写) -->
    <title>INK.SPIRIT</title>
    <meta name="description" content="个人博客 — 记录、创作、分享。" />
    <meta name="keywords" content="博客,技术,编程,生活" />
    <meta name="author" content="CYBER.RONIN" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="INK.SPIRIT" />
    <meta property="og:description" content="个人博客 — 记录、创作、分享。" />
    <meta property="og:site_name" content="INK.SPIRIT" />
    <meta property="og:locale" content="zh_CN" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="INK.SPIRIT" />
    <meta name="twitter:description" content="个人博客 — 记录、创作、分享。" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#10b981" />
    <meta name="msapplication-TileColor" content="#0a0a0a" />
    
    <link rel="alternate" type="application/rss+xml" title="INK.SPIRIT RSS Feed" href="/rss.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700&family=Noto+Serif+SC:wght@400;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-neon-hsl: 150 100% 40%;
        --color-neon-dark-hsl: 150 100% 30%;
        --color-secondary-hsl: 260 90% 65%;
        --color-neon: hsl(150 100% 40%);
        --color-secondary: hsl(260 90% 65%);
      }

    </style>
    <style>
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #fff;
      }
      .dark ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #0a0a0a;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #fff;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-neon);
      }
      .vertical-text {
        writing-mode: vertical-rl;
        text-orientation: upright;
      }
      
      input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #ffffff;
        border: 2px solid #000000;
        cursor: pointer;
        margin-top: -6px;
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        border-radius: 2px;
      }
    </style>
    <link rel="stylesheet" href="/src/index.css">
</head>
  <body class="bg-paper text-ink antialiased overflow-x-hidden selection:bg-neon selection:text-white dark:bg-ink dark:text-paper transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
